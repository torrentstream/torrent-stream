<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		rect {
			fill: #fff;
		}
		text {
			font: 800 21px ui-sans-serif, system-ui, sans-serif;
			fill: #000;
		}
		@media (prefers-color-scheme: dark) {
